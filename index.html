<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b1120" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <title>Jarvis do Moodle — IFSP SPO</title>
  <style>
    :root {
      --bg: #0b1120;
      --card: #151f32;
      --card-hover: #1e293b;
      --border: #26354d;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --urgent: #ef4444;
      --urgent-bg: rgba(239, 68, 68, 0.14);
      --warn: #f59e0b;
      --warn-bg: rgba(245, 158, 11, 0.14);
      --ok: #10b981;
      --ok-bg: rgba(16, 185, 129, 0.14);
      --neutral: #64748b;
      --neutral-bg: rgba(100, 116, 139, 0.16);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 84px;
      line-height: 1.45;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(11, 17, 32, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px 12px;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);
    }
    .brand h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.2px; }
    .brand p { font-size: 11px; color: var(--muted); }
    .sync-pill {
      font-size: 11px;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 4px 9px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .container { max-width: 760px; margin: 0 auto; padding: 14px 14px 24px; }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .kpi {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 8px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s, background 0.15s, box-shadow 0.15s;
      user-select: none;
    }
    .kpi:active { transform: scale(0.97); }
    .kpi.active {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .kpi-num { font-size: 20px; font-weight: 800; line-height: 1.1; }
    .kpi-label { font-size: 10px; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.3px; }
    .search-wrap {
      position: relative;
      margin-bottom: 10px;
    }
    .search-bar {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px 36px 11px 14px;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
    }
    .search-bar:focus { border-color: var(--accent); }
    .clear-search {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.08);
      border: none;
      color: var(--muted);
      width: 24px;
      height: 24px;
      border-radius: 999px;
      font-size: 12px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .clear-search.visible { display: inline-flex; }
    .results-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
      padding: 0 4px;
    }
    .filters {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 10px;
      scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }
    .chip {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }
    .chip.active {
      background: var(--accent);
      color: #082f49;
      border-color: var(--accent);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
      transition: border-color 0.15s, background 0.15s;
    }
    .clickable-card { cursor: pointer; }
    .clickable-card:hover { border-color: rgba(56, 189, 248, 0.45); }
    .card-urgent { border-left: 4px solid var(--urgent); }
    .card-warn { border-left: 4px solid var(--warn); }
    .card-ok { border-left: 4px solid var(--ok); }
    .card-neutral { border-left: 4px solid var(--neutral); }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 6px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .badge-urgent { background: var(--urgent-bg); color: #fca5a5; }
    .badge-warn { background: var(--warn-bg); color: #fcd34d; }
    .badge-ok { background: var(--ok-bg); color: #6ee7b7; }
    .badge-neutral { background: var(--neutral-bg); color: #cbd5e1; }
    .assign-id {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 11px;
      color: var(--muted);
      background: rgba(255,255,255,0.05);
      padding: 2px 6px;
      border-radius: 5px;
    }
    .course-tag {
      font-size: 11px;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 3px;
    }
    .task-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .actions-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid var(--border);
      background: var(--card-hover);
      color: var(--text);
      cursor: pointer;
    }
    .btn-primary {
      background: rgba(56, 189, 248, 0.16);
      border-color: rgba(56, 189, 248, 0.35);
      color: var(--accent);
    }
    .intro-box {
      display: none;
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 9px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border);
      font-size: 12.5px;
      color: #cbd5e1;
      white-space: pre-line;
      max-height: 260px;
      overflow-y: auto;
      cursor: default;
    }
    .intro-box.open { display: block; }
    .grade-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
      margin-top: 8px;
    }

      padding: 8px 6px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }

    .grade-val { font-weight: 700; color: var(--accent); text-align: center; }

      bottom: 0;
      left: 0;
      right: 0;
      z-index: 30;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      max-width: 760px;
      margin: 0 auto;
    }
    .nav-btn {
      background: none;
      border: none;
      color: var(--muted);
      padding: 10px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .nav-btn.active { color: var(--accent); }
    .nav-icon { font-size: 17px; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>

  <header>
    <div class="header-top">
      <div class="brand">
        <div class="brand-icon">🧠</div>
        <div>
          <h1>Jarvis do Moodle</h1>
          <p>Arthur Gomes Almeida • IFSP SPO</p>
        </div>
      </div>
      <div class="sync-pill" id="sync-time">Sincronizado</div>
    </div>
  </header>

  <main class="container">
    <!-- TAB 1: RADAR -->
    <section id="tab-radar" class="tab-panel active">
      <div class="kpi-grid">
        <div class="kpi active" id="kpi-card-urgent" data-kpi="urgentes_7d" onclick="setFilter('urgentes_7d')">
          <div class="kpi-num" id="kpi-urgent" style="color:#f87171">0</div>
          <div class="kpi-label">7 Dias</div>
        </div>
        <div class="kpi active" id="kpi-card-ontime" data-kpi="no_prazo" onclick="setFilter('no_prazo')">
          <div class="kpi-num" id="kpi-ontime" style="color:#34d399">0</div>
          <div class="kpi-label">No Prazo</div>
        </div>
        <div class="kpi" id="kpi-card-openlate" data-kpi="atrasadas_abertas" onclick="setFilter('atrasadas_abertas')">
          <div class="kpi-num" id="kpi-openlate" style="color:#fbbf24">0</div>
          <div class="kpi-label">Atraso Abertas</div>
        </div>
        <div class="kpi" id="kpi-card-done" data-kpi="entregues" onclick="switchTab('entregues')">
          <div class="kpi-num" id="kpi-done" style="color:#38bdf8">0</div>
          <div class="kpi-label">Entregues</div>
        </div>
      </div>

      <div class="search-wrap">
        <input type="search" id="search-input" class="search-bar" placeholder="🔍 Filtrar por matéria, atividade ou ID..." oninput="renderTasks()" />
        <button type="button" id="clear-search-btn" class="clear-search" onclick="clearSearch()" title="Limpar busca">✕</button>
      </div>

      <div class="filters">
        <button class="chip active" data-filter="foco" onclick="setFilter('foco')">🎯 Urgentes & No Prazo</button>
        <button class="chip" data-filter="urgentes_7d" onclick="setFilter('urgentes_7d')">🔥 7 Dias</button>
        <button class="chip" data-filter="no_prazo" onclick="setFilter('no_prazo')">🟢 No Prazo</button>
        <button class="chip" data-filter="atrasadas_abertas" onclick="setFilter('atrasadas_abertas')">🔓 Atrasadas (Aceitam Envio)</button>
        <button class="chip" data-filter="sem_prazo" onclick="setFilter('sem_prazo')">⚪ Sem Prazo</button>
        <button class="chip" data-filter="todas_pendentes" onclick="setFilter('todas_pendentes')">📋 Todas Pendentes</button>
      </div>

      <div class="results-bar">
        <span id="results-count">Carregando...</span>
      </div>

      <div id="radar-list"></div>
    </section>

    <!-- TAB 2: DISCIPLINAS -->
    <section id="tab-cursos" class="tab-panel">
      <div id="cursos-list"></div>
    </section>

    <!-- TAB 3: NOTAS -->
    <section id="tab-notas" class="tab-panel">
      <div id="notas-list"></div>
    </section>

    <!-- TAB 4: ENTREGUES -->
    <section id="tab-entregues" class="tab-panel">
      <div id="entregues-list"></div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="radar" onclick="switchTab('radar')">
      <span class="nav-icon">🚨</span><span>Radar</span>
    </button>
    <button class="nav-btn" data-tab="cursos" onclick="switchTab('cursos')">
      <span class="nav-icon">📚</span><span>Matérias</span>
    </button>
    <button class="nav-btn" data-tab="notas" onclick="switchTab('notas')">
      <span class="nav-icon">📊</span><span>Notas</span>
    </button>
    <button class="nav-btn" data-tab="entregues" onclick="switchTab('entregues')">
      <span class="nav-icon">✅</span><span>Entregues</span>
    </button>
  </nav>

nteúdo abordado hoje (alocação dinâmica de memória) seguem abaixo 3 exercícios extras.\nAtenção: Não precisa entregar.\nExercício 1: Vetor Dinâmico (Soma e Média)\nObjetivo: Praticar a alocação e liberação de memória para um array unidimensional simples.\n• Descrição: Escreva um programa que solicite ao usuário a quantidade de elementos N que ele deseja armazenar. Aloque dinamicamente um vetor de inteiros com esse tamanho. Em seguida, peça ao usuário para digitar os N números, calcule a soma e a média desses valores e exiba os resultados na tela.\n• Requisito: Verificar se a memória foi alocada com sucesso e garantir a liberação da memória ao final da execução.\nExercício 2: Matriz Dinâmica (Tabela de Valores)\nObjetivo: Compreender a alocação dinâmica em duas dimensões usando ponteiros para ponteiros.\n• Descrição: Desenvolva um programa que peça ao usuário o número de linhas e de colunas para criar uma matriz. Aloque dinamicamente a matriz na memória, peça para o usuário preenchê-la com números inteiros e, por fim, exiba a matriz formatada em linhas e colunas na tela.\n• Requisito: Fazer a liberação correta da memória, liberando primeiro o ponteiro de cada linha e depois o ponteiro principal.\nExercício 3: Vetor de struct Dinâmico (Cadastro de Alunos)\nObjetivo: Combinar alocação dinâmica com estruturas de dados customizadas (struct).\n• Descrição: Crie uma estrutura chamada Aluno contendo os seguintes campos:\n◦ nome (texto / array de caracteres)\n◦ idade (inteiro)\n◦ nota (ponto flutuante)\nO programa deve perguntar quantos alunos o usuário deseja cadastrar. Aloque dinamicamente um vetor da estrutura Aluno com esse tamanho, leia os dados de todos os alunos e, ao final, exiba o nome do aluno que obteve a maior nota.\n• Requisito: Liberar o vetor de estruturas da memória antes de encerrar o programa.", "anexos": [], "url": "https://eadcampus.spo.ifsp.edu.br/mod/assign/view.php?id=596194"}, {"assign_id": 80541, "cmid": 596198, "curso_id": 12830, "curso_nome": "SPOEDD1 - Estrutura de Dados 1 - Prof Evandro", "nome": "Tarefa para casa 1", "duedate": 1796698800, "cutoffdate": 0, "duedate_fmt": "08/12/2026 às 00:00", "cutoffdate_fmt": "Sem prazo definido", "entregue": false, "canedit": true, "status_envio_raw": "new", "status_prazo": "🟢 No Prazo (44d restantes)", "status_avaliacao": "Pendente de avaliação", "arquivos_enviados": [], "submissiondrafts": 0, "intro": "Exercício 1 — Cadastro de Alunos usando Struct, Vetor e Ponteiros\nCrie um programa em C para armazenar informações de alunos de uma turma.\nCada aluno deve possuir:\nMatrícula (inteiro)\nNome (string)\nIdade (inteiro)\nMédia final (float)\nUtilize uma\nstruct Aluno\ne um\nvetor de estruturas\npara armazenar até 50 alunos.\nO programa deve possuir as seguintes funções:\nvoid cadastrarAluno(Aluno *aluno);\nvoid exibirAluno(Aluno aluno);\nvoid listarAlunos(Aluno alunos[], int quantidade);\nRequisitos:\nO cadastro deve ser feito utilizando\nponteiro para struct\n.\nA função\nlistarAlunos\ndeve percorrer o vetor utilizando ponteiros.\nAo final, exiba:\nNome dos alunos aprovados (média ≥ 6.0)\nMédia geral da turma.\nExemplo de saída:\nAluno: João Silva\nMédia: 8.5\nAluno: Maria Souza\nMédia: 5.2\nAlunos aprovados:\nJoão Silva\nMédia da turma: 6.85", "anexos": [], "url": "https://eadcampus.spo.ifsp.edu.br/mod/assign/view.php?id=596198"}, {"assign_id": 80542, "cmid": 596200, "curso_id": 12830, "curso_nome": "SPOEDD1 - Estrutura de Dados 1 - Prof Evandro", "nome": "Tarefa para casa 2", "duedate": 1796698800, "cutoffdate": 0, "duedate_fmt": "08/12/2026 às 00:00", "cutoffdate_fmt": "Sem prazo definido", "entregue": false, "canedit": true, "status_envio_raw": "new", "status_prazo": "🟢 No Prazo (44d restantes)", "status_avaliacao": "Pendente de avaliação", "arquivos_enviados": [], "submissiondrafts": 0, "intro": "Exercício 2 — Sistema de Estoque com Struct e Manipulação por Ponteiros\nDesenvolva um sistema simples para controle de estoque de uma loja.\nCrie uma estrutura:\nstruct Produto {\nint codigo;\nchar descricao[50];\nfloat preco;\nint quantidade;\n};\nO programa deve armazenar até\n100 produtos\nem um vetor.\nImplemente as funções:\nvoid cadastrarProduto(struct Produto *p);\nvoid atualizarEstoque(\nstruct Produto *p,\nint quantidade);\nfloat calcularValorEstoque(\nstruct Produto produtos[],\nint tamanho);\nO programa deve permitir:\nCadastro de produtos.\nAtualização da quantidade em estoque.\nCálculo do valor total armazenado:\nvalor estoque =\n(preço do produto) * (quantidade disponível)\nMostrar o produto com maior valor em estoque.\nExemplo:\nProduto: Notebook\nPreço: 3500.00\nQuantidade: 5\nValor total em estoque:\nR$ 17500.00\nMaior estoque:\nNotebook", "anexos": [], "url": "https://eadcampus.spo.ifsp.edu.br/mod/assign/view.php?id=596200"}, {"assign_id": 80810, "cmid": 597913, "curso_id": 12830, "curso_nome": "SPOEDD1 - Estrutura de Dados 1 - Prof Evandro", "nome": "Lista 1 de exercícios - Não precisa entregar", "duedate": 1797217200, "cutoffdate": 0, "duedate_fmt": "14/12/2026 às 00:00", "cutoffdate_fmt": "Sem prazo definido", "entregue": false, "canedit": true, "status_envio_raw": "new", "status_prazo": "🟢 No Prazo (50d restantes)", "status_avaliacao": "Pendente de avaliação", "arquivos_enviados": [], "submissiondrafts": 0, "intro": "", "anexos": [{"filename": "Tarefa_80810_Lista_exercicios_basica.pdf", "caminho_local": "C:\\Users\\arthu\\OneDrive\\Documentos\\Jarvis-Moodle\\Obsidian-Vault\\04_Materiais_e_PDFs\\SPOEDD1 - Estrutura de Dados 1 - Prof Evandro\\Tarefa_80810_Lista_exercicios_basica.pdf", "caminho_vault": "04_Materiais_e_PDFs/SPOEDD1 - Estrutura de Dados 1 - Prof Evandro/Tarefa_80810_Lista_exercicios_basica.pdf"}], "url": "https://eadcampus.spo.ifsp.edu.br/mod/assign/view.php?id=597913"}, {"assign_id": 80812, "cmid": 597926, "curso_id": 12830, "curso_nome": "SPOEDD1 - Estrutura de Dados 1 - Prof Evandro", "nome": "Lista 2 de exercícios", "duedate": 1786676400, "cutoffdate": 0, "duedate_fmt": "14/08/2026 às 00:00", "c  11759, "curso_nome": "SPOGPRO - Gestão de Projetos - Prof Cesar Fernandes", "nome": "TAREFA 4 - PMBOK", "duedate": 1787799540, "cutoffdate": 0, "duedate_fmt": "26/08/2026 às 23:59", "cutoffdate_fmt": "Sem prazo definido", "entregue": false, "canedit": true, "status_envio_raw": "new", "status_prazo": "⚫ Encerrado / Atrasado (58d atrás)", "status_avaliacao": "Pendente de avaliação", "arquivos_enviados": [], "submissiondrafts": 0, "intro": "TAREFA 4 - PMBOK", "anexos": [], "url": "https://eadcampus.spo.ifsp.edu.br/mod/assign/view.php?id=599532"}, {"assign_id": 81404, "cmid": 601191, "curso_id": 11759, "curso_nome": "SPOGPRO - Gestão de Projetos - Prof Cesar Fernandes", "nome": "TAREFA 5 - AULA 5 E 6 EXECUÇÃO E MONITORAMENTO - ENTREGA ATÉ 09/09/26", "duedate": 1789009140, "cutoffdate": 0, "duedate_fmt": "09/09/2026 às 23:59", "cutoffdate_fmt": "Sem prazo definido", "entregue": false, "canedit": true, "status_envio_raw": "new", "status_prazo": "⚫ Encerrado / Atrasado (44d atrás)", "status_avaliacao": "Pendente de avaliação", "arquivos_enviados": [], "submissiondrafts": 0, "intro": "TAREFA 5 - AULA 5 E 6 EXECUÇÃO E MONITORAMENTO - ENTREGA ATÉ 09/09/26", "anexos": [], "url": "https://eadcampus.spo.ifsp.edu.br/mod/assign/view.php?id=601191"}, {"assign_id": 82093, "cmid": 605079, "curso_id": 11759, "curso_nome": "SPOGPRO - Gestão de Projetos - Prof Cesar Fernandes", "nome": "EXERCÍCIO EM GRUPO — GERENCIAMENTO DE PROJETOS COM SCRUM - ENTREGA ATÉ 21/10/26", "duedate": 1792551600, "cutoffdate": 0, "duedate_fmt": "21/10/2026 às 00:00", "cutoffdate_fmt": "Sem prazo definido", "entregue": false, "canedit": true, "status_envio_raw": "new", "status_prazo": "⚫ Encerrado / Atrasado (3d atrás)", "status_avaliacao": "Pendente de avaliação", "arquivos_enviados": [], "submissiondrafts": 0, "intro": "EXERCÍCIO EM GRUPO — GERENCIAMENTO DE PROJETOS COM SCRUM\nTema:\nAplicação do Scrum no Gerenciamento de Projetos\nModalidade:\nTrabalho em grupo\nQuantidade sugerida:\n4 a 6 alunos por grupo\nDuração:\n2 a 3 aulas\nNível:\nSuperior / Tecnologia\nProduto final:\nSimulação completa de um projeto utilizando Scrum\n1. OBJETIVO\nAplicar, de forma prática, os principais conceitos do\nScrum\nno gerenciamento de um projeto, desenvolvendo competências relacionadas a:\nProduct Owner;\nScrum Master;\nDevelopers/Time de Desenvolvimento;\nProduct Backlog;\nUser Stories;\nPriorização;\nSprint Planning;\nSprint Backlog;\nDaily Scrum;\nSprint Review;\nSprint Retrospective;\nIncremento do produto;\nGestão de riscos e mudanças;\nEntrega de valor ao cliente.\n2. DESAFIO DO GRUPO\nCada grupo deverá atuar como uma\nequipe Scrum\nresponsável por desenvolver uma solução tecnológica para um cliente fictício.\nCenário\nUma empresa identificou um problema que precisa ser solucionado por meio de uma aplicação tecnológica.\nO grupo deverá escolher\num dos projetos abaixo\n:\nProjeto A — Aplicativo de Controle Financeiro\nDesenvolver um aplicativo que permita ao usuário:\ncadastrar receitas;\ncadastrar despesas;\ncategorizar gastos;\nvisualizar saldo;\nacompanhar despesas mensais;\ngerar relatórios.\nProjeto B — Sistema de Gestão Acadêmica\nSistema para uma instituição de ensino que permita:\ncadastro de alunos;\ncadastro de professores;\nlançamento de notas;\ncontrole de frequência;\nconsulta de disciplinas;\nemissão de relatórios.\nProjeto C — Aplicativo de Delivery\nAplicativo que permita:\ncadastro de clientes;\nconsulta de produtos;\nrealização de pedidos;\npagamento;\nacompanhamento do pedido;\navaliação do estabelecimento.\nProjeto D — Sistema de Recrutamento e Seleção\nSistema para empresas realizarem:\ncadastro de vagas;\ncadastro de candidatos;\nenvio de currículos;\nanálise de candidatos;\nagendamento de entrevistas;\nacompanhamento do processo seletivo.\nProjeto E — Aplicativo definido pelo grupo\nO grupo poderá propor outro projeto, desde que o professor aprove.\n3. FORMAÇÃO DA EQUIPE SCRUM\nCada grupo deverá distribuir os seguintes papéis:\nPapel\nResponsabilidade\nProduct Owner\nRepresentar o cliente e priorizar o Product Backlog\nScrum Master\nFacilitar o Scrum e remover impedimentos\nDevelopers\nPlanejar e desenvolver o produto\nCliente/Stakeholder\nAvaliar se o produto atende às necessidades\nEm grupos pequenos, uma pessoa poderá acumular funções, exceto quando isso prejudicar a dinâmica.\n4. ETAPA 1 — DEFINIÇÃO DO PRODUTO\nO grupo deverá elaborar o\nProduct Vision Statement\n.\nModelo:\nProduto:\nNome do projeto.\nProblema:\nQual problema o produto pretende solucionar?\nPúblico-alvo:\nQuem utilizará o produto?\nProposta de valor:\nQual benefício será entregue?\nObjetivo principal:\nO que o produto deverá proporcionar?\nExemplo:\nDesenvolver um aplicativo de controle financeiro pessoal que permita aos usuários acompanhar receitas e despesas, visualizar sua situação financeira e tomar decisões melhores sobre seus gastos.\n5. ETAPA 2 — PRODUCT BACKLOG\nO grupo deverá criar pelo menos\n15 itens de Product Backlog\n.\nCada item deverá ser escrito como uma\nUser Story\n.\nModelo\nComo\n[tipo de usuário],\nquero\n[funcionalidade],\npara\n[benefício].\nExemplo:\nComo usuário, quero cadastrar minhas despesas para controlar meus gastos mensais.\nOutro exemplo:\nComo administrador, quero cadastrar novos usuários para permitir o acesso ao sistema.\n6. ETAPA 3 — PRIORIZAÇÃO\nO Product Owner deverá organizar os itens do Product Backlog considerando:\nvalor para o cliente;\nurgência;\nrisco;\ndependências;\ncomplexidade;\nimpacto no negócio.\nClassificação\nO grupo deverá utilizar:\nAlta prioridade\nMédia prioridade\nBaixa prioridade\nExemplo:\nPrioridade\nUser Story\nAlta\nCadastrar usuário\nAlta\nFazer login\nAlta\nCadastrar despesas\nAlta\nConsultar saldo\nMédia\nCategorizar despesas\nMédia\nGerar relatório\nBaixa\nPersonalizar interface\n7. ETAPA 4 — ESTIMATIVA\nO grupo deverá estimar a complexidade das User Stories utilizando\nStory Points\n.\nSugestão de escala:\n1 – muito simples\n2 – simples\n3 – moderado\n5 – complexo\n8 – muito complexo\n13 – extremamente complexo\nExemplo:\nUser Story\nStory Points\nCadastro de usuário\n3\nLogin\n3\nCadastro de despesas\n5\nRelatório financeiro\n8\nDashboard\n8\n8. ETAPA 5 — SPRINT PLANNING\nO grupo deverá simular uma reunião de\nSprint Planning\n.\nDefinição:\nDuração da Sprint:\n1 semana\nObjetivo da Sprint:\n__________________________\nO grupo deverá selecionar as User Stories que serão desenvolvidas durante a Sprint.\nSprint Backlog\nUser Story\nPrioridade\nPontos\nResponsável\nStatus\nLogin\nAlta\n3\nAluno 1\nA Fazer\nCadastro\nAlta\n3\nAluno 2\nA Fazer\nCadastro de despesas\nAlta\n5\nAluno 3\nA Fazer\nConsulta de saldo\nAlta\n5\nAluno 4\nA Fazer\n9. ETAPA 6 — QUADRO SCRUM/KANBAN\nO grupo deverá construir um quadro contendo:\nBACKLOG → A FAZER → EM DESENVOLVIMENTO → EM TESTE → CONCLUÍDO\nExemplo:\nBacklog\nA Fazer\nEm Desenvolvimento\nEm Teste\nConcluído\nRelatórios\nLogin\nCadastro\n—\nCadastro de usuário\nDashboard\nSaldo\nDespesas\n—\n—\nO professor poderá solicitar que o quadro seja feito:\nem cartolina;\nquadro branco;\npost-its;\nPowerPoint;\nTrello;\nJira;\noutra ferramenta autorizada.\n10. ETAPA 7 — DAILY SCRUM\nCada grupo deverá realizar uma\nDaily Scrum simulada\n.\nCada integrante deverá responder:\n1. O que fiz desde a última reunião?\n2. O que farei até a próxima reunião?\n3. Existe algum impedimento?\nExemplo:\nAluno 1\nOntem finalizei o cadastro de usuários.\nHoje vou trabalhar no login.\nMeu impedimento é uma dificuldade na integração com o banco de dados.\nO Scrum Master deverá registrar os impedimentos.\n11. ETAPA 8 — GERENCIAMENTO DE IMPREVISTOS\nDurante a atividade, o professor deverá apresentar\neventos inesperados\naos grupos.\nSituação 1\nO cliente informa:\n\"Precisamos incluir uma nova funcionalidade imediatamente.\"\nO grupo deverá decidir:\naceitar a mudança;\nrejeitar;\ncolocar no Product Backlog;\nalterar a Sprint;\nnegociar com o Product Owner.\nSituação 2\nUm integrante da equipe fica indisponível.\nO grupo deverá decidir como reorganizar o trabalho.\nSituação 3\nUma funcionalidade apresenta um problema grave.\nO grupo deverá avaliar:\nimpacto;\nprioridade;\nesforço;\nprazo;\nvalor para o cliente.\n12. ETAPA 9 — SPRINT REVIEW\nAo final da Sprint, o grupo deverá apresentar o\nIncremento do Produto\n.\nA apresentação deverá responder:\nQual era o objetivo da Sprint?\nO que foi desenvolvido?\nQuais User Stories foram concluídas?\nQuais não foram concluídas?\nQual valor foi entregue ao cliente?\nQuais problemas ocorreram?\nO que deverá entrar na próxima Sprint?\n13. ETAPA 10 — SPRINT RETROSPECTIVE\nApós a apresentação, a equipe deverá realizar uma retrospectiva.\nResponder:\nO que fizemos bem?\nO que não funcionou?\nO que devemos melhorar?\nO que devemos fazer diferente na próxima Sprint?\nExemplo:\nFuncionou bem\nNão funcionou\nMelhoria\nBoa comunicação\nFalta de divisão das tarefas\nDefinir responsáveis\nBacklog organizado\nEstimativas inadequadas\nMelhorar Planning Poker\nParticipação do grupo\nAtrasos\nAcompanhar diariamente\n14. DESAFIO EXTRA — PLANNING POKER\nPara tornar a atividade mais dinâmica, o grupo deverá realizar uma rodada de\nPlanning Poker\n.\nCada integrante deverá estimar individualmente uma User Story.\nExemplo:\nUser Story:\nComo cliente, quero realizar o pagamento do pedido para concluir minha compra.\nEstimativas:\nAluno 1 → 5 pontos\nAluno 2 → 8 pontos\nAluno 3 → 13 pontos\nAluno 4 → 8 pontos\nO grupo deverá discutir as diferenças e chegar a um consenso.\n15. ENTREGA FINAL\nCada grupo deverá entregar:\nDocumento\nNome do projeto;\nProblema identificado;\nPúblico-alvo;\nProduct Vision;\nProduct Owner;\nScrum Master;\nDevelopers;\nProduct Backlog;\nUser Stories;\nPriorização;\nStory Points;\nSprint Goal;\nSprint Backlog;\nQuadro Scrum;\nRegistro das Dailies;\nImpedimentos;\nMudanças ocorridas;\nResultado da Sprint Review;\nSprint Retrospective;\nLições aprendidas.", "anexos": [], "url": "https://eadcampus.spo.ifsp.edu.br/mod/assign/view.php?id=605079"}, {"assign_  "status_prazo": "⚫ Encerrado / Atrasado (151d atrás)", "status_avaliacao": "Pendente de avaliação", "arquivos_enviados": [], "submissiondrafts": 0, "intro": "Apenas um envio por grupo basta.\nColoque o nome de todos os componentes no cabeçalho do arquivo.\nEnvie preferencialmente em formato PDF.", "anexos": [], "url": "https://eadcampus.spo.ifsp.edu.br/mod/assign/view.php?id=579502"}, {"assign_id": 77794, "cmid": 579515, "curso_id": 12216, "curso_nome": "SPOMPC1 - Metodologia de Pesquisa Científica 1", "nome": "Entrega do Artigo Científico - Até 8 de junho de 2026", "duedate": 1780973940, "cutoffdate": 0, "duedate_fmt": "08/06/2026 às 23:59", "cutoffdate_fmt": "Sem prazo definido", "entregue": false, "canedit": true, "status_envio_raw": "new", "status_prazo": "⚫ Encerrado / Atrasado (137d atrás)", "status_avaliacao": "Pendente de avaliação", "arquivos_enviados": [], "submissiondrafts": 0, "intro": "", "anexos": [], "url": "https://eadcampus.spo.ifsp.edu.br/mod/assign/view.php?id=579515"}, {"assign_id": 77966, "cmid": 580957, "curso_id": 12216, "curso_nome": "SPOMPC1 - Metodologia de Pesquisa Científica 1", "nome": "Enviar atividade - Definições e discussões - até 25/03/2026", "duedate": 1774493940, "cutoffdate": 0, "duedate_fmt": "25/03/2026 às 23:59", "cutoffdate_fmt": "Sem prazo definido", "entregue": false, "canedit": true, "status_envio_raw": "new", "status_prazo": "⚫ Encerrado / Atrasado (212d atrás)", "status_avaliacao": "Pendente de avaliação", "arquivos_enviados": [], "submissiondrafts": 0, "intro": "", "anexos": [], "url": "https://eadcampus.spo.ifsp.edu.br/mod/assign/view.php?id=580957"}, {"assign_id": 78291, "cmid": 582887, "curso_id": 12216, "curso_nome": "SPOMPC1 - Metodologia de Pesquisa Científica 1", "nome": "Replicabilidade e reprodutibilidade", "duedate": 1775703540, "cutoffdate": 0, "duedate_fmt": "08/04/2026 às 23:59", "cutoffdate_fmt": "Sem prazo definido", "entregue": true, "canedit": true, "status_envio_raw": "submitted", "status_prazo": "✅ Entregue", "status_avaliacao": "Pendente de avaliação", "arquivos_enviados": ["Metodologia 8 Abril.pdf"], "submissiondrafts": 0, "intro": "", "anexos": [], "url": "https://eadcampus.spo.ifsp.edu.br/mod/assign/view.php?id=582887"}, {"assign_id": 78607, "cmid": 584555, "curso_id": 12216, "curso_nome": "SPOMPC1 - Metodologia de Pesquisa Científica 1", "nome": "Enviar análise de um artigo - tipo de estudo", "duedate": 1776913140, "cutoffdate": 0, "duedate_fmt": "22/04/2026 às 23:59", "cutoffdate_fmt": "Sem prazo definido", "entregue": false, "canedit": true, "status_envio_raw": "new", "status_prazo": "⚫ Encerrado / Atrasado (184d atrás)", "status_avaliacao": "Pendente de avaliação", "arquivos_enviados": [], "submissiondrafts": 0, "intro": "", "anexos": [{"filename": "Tarefa_78607_atividade_tipo_de_estudo_TI.pdf", "caminho_local": "C:\\Users\\arthu\\OneDrive\\Documentos\\Jarvis-Moodle\\Obsidian-Vault\\04_Materiais_e_PDFs\\SPOMPC1 - Metodologia de Pesquisa Científica 1\\Tarefa_78607_atividade_tipo_de_estudo_TI.pdf", "caminho_vault": "04_Materiais_e_PDFs/SPOMPC1 - Metodologia de Pesquisa Científica 1/Tarefa_78607_atividade_tipo_de_estudo_TI.pdf"}], "url": "https://eadcampus.spo.ifsp.edu.br/mod/assign/view.php?id=584555"}, {"assign_id": 78720, "cmid": 585074, "curso_id": 12216, "curso_nome": "SPOMPC1 - Metodologia de Pesquisa Científica 1", "nome": "Enviar a justificativa e o objetivo - até 11 de maio", "duedate": 1778552580, "cutoffdate": 0, "duedate_fmt": "11/05/2026 às 23:23", "cutoffdate_fmt": "Sem prazo definido", "entregue": false, "canedit": true, "status_envio_raw": "new", "status_prazo": "⚫ Encerrado / Atrasado (165d atrás)", "status_avaliacao": "Pendente de avaliação", "arquivos_enviados": [], "submissiondrafts": 0, "intro": "Entrega do Objetivo e da Introdução (Justificativa) do Projeto de Pesquisa\nNesta atividade, o estudante deverá elaborar e apresentar o\nobjetivo\ne a introdução (\njustificativa)\ndo projeto de pesquisa que será desenvolvido ao longo da disciplina.\nO tema do artigo deve estar relacionado à área de interesse do estudante, preferencialmente vinculado à\nTecnologia da Informação, Ciência da Computação, Sistemas de Informação ou áreas correlatas\n, podendo envolver tópicos como transformação digital, análise de dados, inovação, integração de sistemas, saúde digital, inteligência artificial, governança de TI, entre outros.\nO que deve ser entregue\nTema provisório do artigo\nApresentar um título preliminar que represente o problema de pesquisa.\nIntrodução (Justificativa) do artigo:\nA\npresentar o\nproblema, a relevância e a motivação do estudo\n.\nDepois de mostrar\npor que o tema é importante\n, o texto naturalmente conduz ao\nobjetivo\n, que define\no que será feito para investigar ou resolver o problema\n.\nObjetivo do artigo:\nDescrever de forma clara e direta o propósito da pesquisa. O objetivo deve indicar: o que será investigado; qual fenômeno, problema ou relação será analisado; qual contribuição se espera gerar. Recomenda-se utilizar verbos no infinitivo, tais como:\nanalisar, avaliar, investigar, comparar, propor, desenvolver, identificar, verificar\n.\nExemplo\nIntrodução (Justificativa):\nExiste uma necessidade de melhorar a integração entre sistemas ERP e plataformas de e-commerce, pois falhas de interoperabilidade podem impactar a eficiência operacional. (Precisa apresentar muito mais que isso...é ncessário estruturar um argumento para justificar que é um problema!)\nObjetivo:\nDiante desse contexto, o presente estudo tem como objetivo analisar o impacto da integração via iPaaS na eficiência de operações B2C.", "anexos": [], "url": "https://eadcampus.spo.ifsp.edu.br/mod/assign/view.php?id=585074"}, {"assign_id": 72456, "cmid": 542930, "curso_id": 11162, "curso_nome": "SPOREDC - Redes de computadores - Profa Daniela", "nome": "exercícios de conversão", "duedate": 1775530740, "cutoffdate": 1775530740, "duedate_fmt": "06/04/2026 às 23:59", "cutoffdate_fmt": "06/04/2026 às 23:59", "entregue": tr     let currentFilter = 'foco';

    function calcLiveStatus(t) {
      const nowSec = Math.floor(Date.now() / 1000);
      const due = t.duedate || 0;
      const canEdit = t.canedit !== undefined ? t.canedit : true;
      if (t.entregue) {
        return { category: 'entregue', label: '✅ Entregue', cls: 'ok', diffH: 999999 };
      }
      if (!due || due <= 0) {
        return { category: 'sem_prazo', label: '⚪ Sem prazo definido', cls: 'neutral', diffH: 99999 };
      }
      const diffSec = due - nowSec;
      const diffH = diffSec / 3600;
      if (diffSec < 0) {
        const d = Math.floor(Math.abs(diffH) / 24);
        const h = Math.floor(Math.abs(diffH) % 24);
        const tempo = d > 0 ? `${d}d atrás` : `${h}h atrás`;
        if (canEdit) {
          return { category: 'atrasada_aberta', label: `🔓 Atrasada (${tempo}) • Aceita Envio`, cls: 'warn', diffH };
        }
        return { category: 'encerrada', label: `🔒 Encerrada (${tempo})`, cls: 'neutral', diffH };
      } else if (diffH <= 48) {
        const h = Math.floor(diffH);
        const m = Math.floor((diffSec % 3600) / 60);
        return { category: 'urgente', label: `🔴 URGENTE (Faltam ${h}h ${m}m)`, cls: 'urgent', diffH };
      } else if (diffH <= 168) {
        const d = Math.floor(diffH / 24);
        const h = Math.floor(diffH % 24);
        return { category: 'semana', label: `🟡 Esta Semana (Faltam ${d}d ${h}h)`, cls: 'warn', diffH };
      } else {
        const d = Math.floor(diffH / 24);
        return { category: 'no_prazo', label: `🟢 No Prazo (${d} dias restantes)`, cls: 'ok', diffH };
      }
    }

    function escapeHtml(s) {

      const kpiOpenlate = document.getElementById('kpi-card-openlate');
      if (kpiUrgent) kpiUrgent.classList.toggle('active', currentFilter === 'urgentes_7d' || currentFilter === 'foco');
      if (kpiOntime) kpiOntime.classList.toggle('active', currentFilter === 'no_prazo' || currentFilter === 'foco');
      if (kpiOpenlate) kpiOpenlate.classList.toggle('active', currentFilter === 'atrasadas_abertas');
    }

    function setFilter(f) {
      currentFilter = f;
      syncActiveStates();
      switchTab('radar');
      renderTasks();
    }

    function clearSearch() {
      const inp = document.getElementById('search-input');
      if (inp) inp.value = '';
      renderTasks();
    }

    function filterByCourse(courseId) {
      const course = DATA.cursos.find(c => c.id === courseId);
      if (!course) return;
      const inp = document.getElementById('search-input');
      if (inp) inp.value = course.fullname;
      currentFilter = 'todas_pendentes';
      syncActiveStates();
      switchTab('radar');
      renderTasks();
    }

    function toggleIntro(id) {
      const el = document.getElementById('intro-' + id);
      if (!el) return;
      const isOpen = el.classList.toggle('open');
      const btn = document.getElementById('btn-intro-' + id);
      if (btn && btn.dataset.labelOpen && btn.dataset.labelClosed) {
        btn.textContent = isOpen ? btn.dataset.labelOpen : btn.dataset.labelClosed;
      }
    }

    function handleCardClick(e, id) {
      if (e.target.closest('a, button, .intro-box')) return;
      toggleIntro(id);
    }

    function renderTasks() {
      const inp = document.getElementById('search-input');
      const rawQ = inp ? inp.value : '';
      const q = (rawQ || '').toLowerCase().trim();
      const clearBtn = document.getElementById('clear-search-btn');
      if (clearBtn) clearBtn.classList.toggle('visible', q.length > 0);

      const list = document.getElementById('radar-list');
      const enriched = DATA.todas_tarefas
        .filter(t => !t.entregue)
        .map(t => ({ ...t, _live: calcLiveStatus(t) }));

      const filtered = enriched.filter(t => {
        if (q) {
          const hay = `${t.nome} ${t.curso_nome} ${t.assign_id}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        const cat = t._live.category;
        if (currentFilter === 'foco') {
          return cat === 'urgente' || cat === 'semana' || cat === 'no_prazo';
        } else if (currentFilter === 'urgentes_7d') {
          return cat === 'urgente' || cat === 'semana';
        } else if (currentFilter === 'no_prazo') {
          return cat === 'no_prazo';
        } else if (currentFilter === 'atrasadas_abertas') {
          return cat === 'atrasada_aberta';
        } else if (currentFilter === 'sem_prazo') {
          return cat === 'sem_prazo';
        }
        return true;
      });

      filtered.sort((a, b) => {
        const da = a.duedate > 0 ? a.duedate : 9999999999;
        const db = b.duedate > 0 ? b.duedate : 9999999999;
        return da - db;
      });

      const countEl = document.getElementById('results-count');
      if (countEl) {
        countEl.textContent = `Exibindo ${filtered.length} atividade(s)` + (q ? ` para "${rawQ.trim()}"` : '');
      }

      if (!filtered.length) {
        list.innerHTML = `<div class="empty-state">🎉 Nenhuma atividade encontrada neste filtro!</div>`;
        return;
      }

      list.innerHTML = filtered.map(t => {
        const st = t._live;
        const anexos = (t.anexos || []).map(a => a.filename).join(', ');
        const introText = t.intro || 'Sem texto adicional na descrição da atividade no Moodle.';
        return `
          <div class="card card-${st.cls} clickable-card" data-assign-id="${t.assign_id}" onclick="handleCardClick(event, '${t.assign_id}')">
            <div class="card-top">
              <span class="badge badge-${st.cls}">${escapeHtml(st.label)}</span>
              <span class="assign-id">ID: ${t.assign_id}</span>
            </div>
            <div class="course-tag">${escapeHtml(t.curso_nome)}</div>
            <div class="task-title">${escapeHtml(t.nome)}</div>
            <div class="meta-row">
              <span>📅 Prazo: <strong>${escapeHtml(t.duedate_fmt)}</strong></span>
              <span>${t.canedit !== false ? '🔓 Submissão aberta' : '🔒 Submissão bloqueada'}</span>
            </div>
            <div class="actions-row">
              <a class="btn btn-primary" href="${escapeHtml(t.url)}" target="_blank" rel="noopener">Abrir no Moodle ↗</a>
              <button type="button" class="btn btn-intro-toggle" id="btn-intro-${t.assign_id}" data-label-closed="📄 Ver Enunciado" data-label-open="🔼 Ocultar Enunciado" onclick="toggleIntro('${t.assign_id}')">📄 Ver Enunciado</button>
            </div>
            <div class="intro-box" id="intro-${t.assign_id}">
              ${anexos ? `<strong>📎 Anexos:</strong> ${escapeHtml(anexos)}\n\n` : ''}${escapeHtml(introText)}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderCursos() {
      const container = document.getElementById('cursos-list');
      container.innerHTML = DATA.cursos.map(c => {
        const pdfList = (c.pdfs || []).map(p => `• ${escapeHtml(p.filename)} <span style="color:var(--muted)">(${escapeHtml(p.secao)})</span>`).join('\n');
        const courseTasks = DATA.todas_tarefas.filter(t => t.curso_id === c.id);
        const taskListHtml = courseTasks.map(t => {
          const st = calcLiveStatus(t);
          return `• <strong>${escapeHtml(t.nome)}</strong> — <span style="color:var(--accent)">${escapeHtml(st.label)}</span> (${escapeHtml(t.duedate_fmt)})`;
        }).join('\n');
        return `
          <div class="card" data-course-id="${c.id}">
            <div class="card-top">
              <span class="course-tag">Curso ID: ${c.id}</span>
              <span class="assign-id">${escapeHtml(c.shortname)}</span>
            </div>
            <div class="task-title">${escapeHtml(c.fullname)}</div>
            <div class="meta-row">
              <span>📝 ${c.tarefas_count} tarefas</span>
              <span>📄 ${c.pdfs_count} arquivos/PDFs</span>
            </div>
            <div class="actions-row">
              ${c.pdfs_count > 0 ? `<button type="button" class="btn btn-pdfs-toggle" id="btn-intro-curso-${c.id}" data-label-closed="📂 Ver ${c.pdfs_count} PDFs baixados" data-label-open="🔼 Ocultar PDFs" onclick="toggleIntro('curso-${c.id}')">📂 Ver ${c.pdfs_count} PDFs baixados</button>` : ''}
              ${c.tarefas_count > 0 ? `<button type="button" class="btn btn-tasks-toggle" id="btn-intro-curso-tasks-${c.id}" data-label-closed="📝 Ver ${c.tarefas_count} Tarefas" data-label-open="🔼 Ocultar Tarefas" onclick="toggleIntro('curso-tasks-${c.id}')">📝 Ver ${c.tarefas_count} Tarefas</button>` : ''}
              ${c.tarefas_count > 0 ? `<button type="button" class="btn btn-primary btn-filter-course" onclick="filterByCourse(${c.id})">🚨 Filtrar no Radar</button>` : ''}
            </div>
            ${c.pdfs_count > 0 ? `<div class="intro-box" id="intro-curso-${c.id}">${pdfList}</div>` : ''}
            ${c.tarefas_count > 0 ? `<div class="intro-box" id="intro-curso-tasks-${c.id}">${taskListHtml}</div>` : ''}
          </div>
        `;
      }).join('');
    }

    function renderNotas() {
      const container = document.getElementById('notas-list');
      const comNotas = DATA.cursos.filter(c => (c.notas || []).length > 0);
      container.innerHTML = comNotas.map(c => `
        <div class="card">
          <div class="task-title">${escapeHtml(c.fullname)}</div>
          <table class="grade-table">
            <thead>
              <tr><th>Avaliação</th><th style="text-align:center">Nota</th><th>Feedback</th></tr>
            </thead>
            <tbody>
              ${c.notas.map(n => `
                <tr>
                  <td>${escapeHtml(n.itemname)}</td>
                  <td class="grade-val">${escapeHtml(n.gradeformatted)} <span style="color:var(--muted);font-weight:400">/ ${n.grademax}</span></td>
                  <td style="color:var(--muted)">${escapeHtml(n.feedback || '-')}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `).join('');
    }

    function renderEntregues() {
      const container = document.getElementById('entregues-list');
      const entregues = DATA.todas_tarefas
        .filter(t => t.entregue)
        .sort((a, b) => (b.duedate || 0) - (a.duedate || 0));
      container.innerHTML = entregues.map(t => {
        const anexos = (t.anexos || []).map(a => a.filename).join(', ');
        const introText = t.intro || 'Sem texto adicional na descrição da atividade.';
        return `
        <div class="card card-ok clickable-card" onclick="handleCardClick(event, 'done-${t.assign_id}')">
          <div class="card-top">
            <span class="badge badge-ok">✅ Entregue • ${escapeHtml(t.status_avaliacao)}</span>
            <span class="assign-id">ID: ${t.assign_id}</span>
          </div>
          <div class="course-tag">${escapeHtml(t.curso_nome)}</div>
          <div class="task-title">${escapeHtml(t.nome)}</div>
          <div class="meta-row">
            <span>📅 Prazo: ${escapeHtml(t.duedate_fmt)}</span>
            <span>📎 ${escapeHtml((t.arquivos_enviados || []).join(', ') || 'Texto online')}</span>
          </div>
          <div class="actions-row">
            <a class="btn btn-primary" href="${escapeHtml(t.url)}" target="_blank" rel="noopener">Ver no Moodle ↗</a>
            <button type="button" class="btn btn-intro-toggle" id="btn-intro-done-${t.assign_id}" data-label-closed="📄 Ver Enunciado" data-label-open="🔼 Ocultar Enunciado" onclick="toggleIntro('done-${t.assign_id}')">📄 Ver Enunciado</button>
          </div>
          <div class="intro-box" id="intro-done-${t.assign_id}">
            ${anexos ? `<strong>📎 Anexos:</strong> ${escapeHtml(anexos)}\n\n` : ''}${escapeHtml(introText)}
          </div>
        </div>
      `}).join('');
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      const panel = document.getElementById('tab-' + tab);
      if (panel) panel.classList.add('active');
      const btn = document.querySelector(`.nav-btn[data-tab="${tab}"]`);
      if (btn) btn.classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    updateKPIs();
    syncActiveStates();
    renderTasks();
    renderCursos();
    renderNotas();
    renderEntregues();
    setInterval(() => { updateKPIs(); renderTasks(); }, 60000);
  </script>
</body>
</html>
